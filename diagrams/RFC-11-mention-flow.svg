<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720" role="img" aria-labelledby="title desc">
  <title id="title">RFC-11: sending a mention</title>
  <desc id="desc">Sequence diagram. The sender publishes a post that names @tim.example.com or replies to an item of Tim's. It fetches host-meta.json from Tim's domain and finds the mention endpoint, then posts a webmention with the post as source and Tim's domain or the answered item as target. The receiver answers 202 Accepted. Asynchronously, it fetches the post, verifies that it contains the handle, or that its inReplyTo is the target and the target is Tim's item, and adds the mention to Tim's inbox.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --life: #c8d1da; --accent: #0969da; --box: #f6f8fa; --boxline: #d0d7de; --note: #ddf4ff; --noteline: #80ccff; --badge-fg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --life: #3d444d; --accent: #4493f8; --box: #151b23; --boxline: #3d444d; --note: #0d2847; --noteline: #1f6feb; --badge-fg: #0d1117; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 18px; font-weight: 600; }
    .head { fill: var(--box); stroke: var(--boxline); stroke-width: 1; }
    .name { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .role { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .life { stroke: var(--life); stroke-width: 1.5; stroke-dasharray: 2 5; }
    .req { stroke: var(--accent); stroke-width: 1.6; fill: none; }
    .res { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    .req-head { fill: var(--accent); }
    .res-head { fill: var(--muted); }
    .label, .sub, .reply { font-size: 13px; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .sub { font-size: 12px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .reply { fill: var(--muted); }
    .badge { fill: var(--accent); }
    .badge-n { font-size: 11px; font-weight: 700; fill: var(--badge-fg); text-anchor: middle; }
    .bar { fill: var(--note); stroke: var(--noteline); stroke-width: 1; }
    .note { fill: var(--note); stroke: var(--noteline); stroke-width: 1; }
    .note-h { font-size: 13px; font-weight: 600; }
    .note-t { font-size: 12px; }
    .async { font-size: 12px; font-style: italic; fill: var(--muted); }
  </style>
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="req-head"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="res-head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="720" rx="12"/>
  <text class="title" x="30" y="32">Sending a mention (RFC-11)</text>

  <!-- Participants -->
  <g>
    <rect class="head" x="30" y="48" width="180" height="52" rx="8"/>
    <text class="name" x="120" y="70">Sender</text>
    <text class="role" x="120" y="88">blog engine or RFC-4 server</text>

    <rect class="head" x="300" y="48" width="180" height="52" rx="8"/>
    <text class="name" x="390" y="70">Source</text>
    <text class="role" x="390" y="88">the post, in the sender's feed</text>

    <rect class="head" x="570" y="48" width="180" height="52" rx="8"/>
    <text class="name" x="660" y="70">Owner's domain</text>
    <text class="role" x="660" y="88">host-meta.json</text>

    <rect class="head" x="840" y="48" width="180" height="52" rx="8"/>
    <text class="name" x="930" y="70">Receiver</text>
    <text class="role" x="930" y="88">mention endpoint, inbox</text>
  </g>

  <!-- Lifelines -->
  <line class="life" x1="120" y1="100" x2="120" y2="690"/>
  <line class="life" x1="390" y1="100" x2="390" y2="690"/>
  <line class="life" x1="660" y1="100" x2="660" y2="690"/>
  <line class="life" x1="930" y1="100" x2="930" y2="690"/>

  <!-- Receiver processing -->
  <rect class="bar" x="925" y="455" width="10" height="210"/>

  <!-- 1: publish the post -->
  <line class="req" x1="132" y1="160" x2="388" y2="160" marker-end="url(#req)"/>
  <circle class="badge" cx="120" cy="160" r="10"/><text class="badge-n" x="120" y="164">1</text>
  <text class="label" x="255" y="150">Publish the post</text>
  <text class="sub" x="255" y="178">@tim.example.com, or a reply</text>

  <!-- 2: discover the endpoint -->
  <line class="req" x1="132" y1="245" x2="658" y2="245" marker-end="url(#req)"/>
  <circle class="badge" cx="120" cy="245" r="10"/><text class="badge-n" x="120" y="249">2</text>
  <text class="label" x="390" y="235">GET /.well-known/host-meta.json</text>
  <line class="res" x1="658" y1="275" x2="122" y2="275" marker-end="url(#res)"/>
  <text class="reply" x="390" y="267">link rel …/ns/mention: the endpoint</text>

  <!-- 3: webmention -->
  <line class="req" x1="132" y1="345" x2="928" y2="345" marker-end="url(#req)"/>
  <circle class="badge" cx="120" cy="345" r="10"/><text class="badge-n" x="120" y="349">3</text>
  <text class="label" x="525" y="335">POST webmention to the endpoint</text>
  <text class="sub" x="525" y="363">source = the post, target = domain or item</text>
  <line class="res" x1="928" y1="400" x2="122" y2="400" marker-end="url(#res)"/>
  <text class="reply" x="525" y="392">202 Accepted</text>

  <text class="async" x="944" y="431">asynchronously:</text>

  <!-- 4: fetch the source -->
  <line class="req" x1="918" y1="455" x2="392" y2="455" marker-end="url(#req)"/>
  <circle class="badge" cx="930" cy="455" r="10"/><text class="badge-n" x="930" y="459">4</text>
  <text class="label" x="655" y="445">GET the source</text>
  <line class="res" x1="392" y1="485" x2="923" y2="485" marker-end="url(#res)"/>
  <text class="reply" x="655" y="477">the post, found by its id</text>

  <!-- 5: verify -->
  <rect class="note" x="680" y="505" width="240" height="88" rx="6"/>
  <circle class="badge" cx="698" cy="523" r="9"/><text class="badge-n" x="698" y="527">5</text>
  <text class="note-h" x="714" y="528">Verify</text>
  <text class="note-t" x="694" y="548">by name: the handle is in the text</text>
  <text class="note-t" x="694" y="565">reply: inReplyTo = target,</text>
  <text class="note-t" x="694" y="582">and the target is Tim's item</text>

  <!-- 6: deliver -->
  <rect class="note" x="680" y="603" width="240" height="54" rx="6"/>
  <circle class="badge" cx="698" cy="621" r="9"/><text class="badge-n" x="698" y="625">6</text>
  <text class="note-h" x="714" y="626">Add to the inbox</text>
  <text class="note-t" x="694" y="646">kind: mention or reply</text>
</svg>
